name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "orchestrator/**"
      - ".openchamber-version"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/yaman/openchamber-orchestrator/orchestrator
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: orchestrator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  openchamber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          V=$(cat .openchamber-version)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/yaman/openchamber-orchestrator/openchamber:$V" >> "$GITHUB_OUTPUT"
          echo "Building OpenChamber $V from upstream tag v$V"

      - uses: actions/checkout@v4
        with:
          repository: openchamber/openchamber
          ref: v${{ steps.version.outputs.version }}
          path: openchamber-src

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: openchamber-src
          file: openchamber-src/Dockerfile
          push: true
          tags: ${{ steps.version.outputs.image }}
          cache-from: type=gha,scope=openchamber
          cache-to: type=gha,mode=max,scope=openchamber
