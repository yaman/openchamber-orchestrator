<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WorqCompany AI Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0b0e14; color: #e6edf3; font-family: -apple-system, "Segoe UI", sans-serif; }
  .card { text-align: center; max-width: 440px; padding: 48px 32px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p  { font-size: 15px; color: #8b949e; margin: 0 0 32px; line-height: 1.6; }
  a.btn { display: inline-block; background: #238636; color: #fff; text-decoration: none;
          padding: 12px 28px; border-radius: 8px; font-weight: 600; font-size: 15px; }
  a.btn:hover { background: #2ea043; }
</style>
</head>
<body>
  <div class="card">
    <h1>WorQ AI Workspace</h1>
    <p>Your personal OpenChamber coding environment. Sign in with your WorqCompany Google account to get started.</p>
    <a class="btn" href="/oauth2/start?rd=/">Sign in with Google</a>
  </div>
</body>
</html>
